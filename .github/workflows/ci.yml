name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check server.js
      - run: node --check addon/server.js
      - run: node scripts/validate-config.js examples/frameo-climate.json
      - run: node scripts/validate-config.js examples/starter.json
      - name: Verify addon/server.js is in sync
        run: node scripts/sync-addon.js --check
      - name: Verify the add-on repository structure
        run: node scripts/validate-addon-repo.js
      - name: Check the Blink proxy auto-restart rules
        run: node scripts/check-proxy-auto-restart.js
      - name: Check pages stay under the ingress prefix
        run: node scripts/check-ingress-urls.js
      - name: Check companion visibility and service guards
        run: node scripts/check-balance-companion.js
      - name: Check room companion visibility
        run: node scripts/check-room-companion.js
